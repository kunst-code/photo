<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수강생 사진 명부</title>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBNrzAJtYQh8ZBpZaLD-WC2GlLKSwdoPcY",
    authDomain: "filmphoto-ae70b.firebaseapp.com",
    databaseURL: "https://filmphoto-ae70b-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "filmphoto-ae70b",
    storageBucket: "filmphoto-ae70b.firebasestorage.app",
    messagingSenderId: "71282282465",
    appId: "1:71282282465:web:1b75bdde9151d3d27e8ca0",
    measurementId: "G-D08PMV2K88"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window._db = db;
  window._ref = ref;
  window._set = set;
  window._onValue = onValue;
  window.firebaseReady = true;
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<!-- SheetJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --border: #e2e0d8;
    --accent: #2c5f8a;
    --accent-light: #e8f0f7;
    --text: #1a1a1a;
    --muted: #6b6a65;
    --danger: #c0392b;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: var(--accent); color: #fff; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 20px; font-weight: 600; }
  header .subtitle { font-size: 13px; opacity: 0.75; margin-top: 2px; }

  .toolbar { display: flex; gap: 10px; padding: 16px 32px; align-items: center; flex-wrap: wrap; background: var(--card); border-bottom: 1px solid var(--border); }
  .toolbar label.upload-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--accent); color: #fff; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 500; }
  .toolbar label.upload-btn:hover { opacity: 0.88; }
  .toolbar input[type=file] { display: none; }

  .btn { padding: 8px 16px; border-radius: var(--radius); border: 1.5px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .btn.danger { border-color: #e8d0ce; color: var(--danger); }
  .btn.danger:hover { background: #fdf0f0; }
  .toolbar-sep { width: 1px; height: 28px; background: var(--border); margin: 0 4px; }

  .status-bar { padding: 8px 32px; font-size: 12px; color: var(--muted); background: var(--accent-light); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
  .status-dot.ok { background: #27ae60; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 28px 32px; }

  .card { background: var(--card); border-radius: 12px; border: 1.5px solid var(--border); overflow: hidden; transition: box-shadow 0.2s, transform 0.2s; position: relative; }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); transform: translateY(-2px); }

  .card-img-wrap { position: relative; cursor: zoom-in; }
  .card-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
  .card-img-placeholder { width: 100%; aspect-ratio: 3/4; background: #e8edf2; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #aab8c8; }
  .zoom-hint { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.5); color: #fff; border-radius: 20px; padding: 2px 8px; font-size: 10px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .card-img-wrap:hover .zoom-hint { opacity: 1; }

  .card-body { padding: 12px; }
  .card-filename { font-size: 11px; color: var(--muted); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-field { margin-bottom: 6px; }
  .card-field label { display: block; font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
  .card-field input { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1.5px solid var(--border); font-size: 13px; color: var(--text); background: var(--bg); font-family: inherit; }
  .card-field input:focus { outline: none; border-color: var(--accent); background: #fff; }

  .save-indicator { position: absolute; top: 8px; right: 8px; background: rgba(39,174,96,0.9); color: #fff; border-radius: 20px; padding: 2px 8px; font-size: 10px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .save-indicator.show { opacity: 1; }

  .empty-state { grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 52px; margin-bottom: 16px; }
  .empty-state h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }

  /* ── Lightbox ── */
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 90vw; max-height: 82vh; border-radius: 8px; object-fit: contain; box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
  #lightbox-info { color: #fff; font-size: 15px; text-align: center; }
  #lightbox-info .lb-name { font-weight: 600; font-size: 17px; }
  #lightbox-info .lb-id { opacity: 0.7; font-size: 13px; margin-top: 2px; }
  #lightbox-close { position: fixed; top: 20px; right: 24px; color: #fff; font-size: 28px; cursor: pointer; line-height: 1; background: none; border: none; }

  /* ── 인쇄용 PDF 레이아웃 ── */
  #print-area { display: none; }

  @media print {
    body > *:not(#print-area) { display: none !important; }
    #print-area {
      display: block !important;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    .print-header { text-align: center; margin-bottom: 16px; }
    .print-header h2 { font-size: 18px; font-weight: 700; }
    .print-header p { font-size: 11px; color: #888; margin-top: 4px; }
    .print-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .print-card { border: 1px solid #ddd; border-radius: 6px; overflow: hidden; break-inside: avoid; }
    .print-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
    .print-card .print-no-img { width: 100%; aspect-ratio: 3/4; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .print-card-body { padding: 6px 8px; }
    .print-card-body .pname { font-size: 12px; font-weight: 700; }
    .print-card-body .pid { font-size: 10px; color: #666; margin-top: 1px; }
    .print-card-body .pfile { font-size: 9px; color: #aaa; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  }

  #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1a1a; color: #fff; padding: 10px 22px; border-radius: 24px; font-size: 13px; font-weight: 500; z-index: 999; transition: transform 0.3s; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    .toolbar { padding: 12px 16px; }
    .grid { padding: 16px; gap: 14px; }
    header { padding: 14px 16px; }
    .status-bar { padding: 8px 16px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>📋 수강생 사진 명부</h1>
    <div class="subtitle">사진을 업로드하고 학번·이름을 입력하면 자동 저장됩니다</div>
  </div>
  <div style="font-size:13px;opacity:0.7;" id="count-label">0명</div>
</header>

<div class="toolbar">
  <label class="upload-btn">
    📁 사진 폴더 선택
    <input type="file" id="file-input" multiple accept="image/*">
  </label>
  <div class="toolbar-sep"></div>
  <button class="btn" onclick="printPDF()">🖨️ PDF 저장</button>
  <button class="btn" onclick="downloadExcel()">⬇ Excel 저장</button>
  <div class="toolbar-sep"></div>
  <button class="btn danger" onclick="clearAll()">🗑 전체 삭제</button>
</div>

<div class="status-bar">
  <span class="status-dot" id="fb-dot"></span>
  <span id="fb-status">Firebase 연결 중...</span>
</div>

<div class="grid" id="grid">
  <div class="empty-state">
    <div class="icon">🖼️</div>
    <h2>사진을 업로드해 주세요</h2>
    <p>위의 "사진 폴더 선택" 버튼으로 여러 장을 한번에 선택할 수 있습니다</p>
  </div>
</div>

<!-- 인쇄 전용 영역 -->
<div id="print-area">
  <div class="print-header">
    <h2>수강생 사진 명부</h2>
    <p id="print-date"></p>
  </div>
  <div class="print-grid" id="print-grid"></div>
</div>

<!-- 라이트박스 -->
<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lb-img" src="" alt="">
  <div id="lightbox-info">
    <div class="lb-name" id="lb-name"></div>
    <div class="lb-id" id="lb-id"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const state = { items: [], dbReady: false };

function waitFirebase(cb) {
  if (window.firebaseReady) cb();
  else window.addEventListener('firebase-ready', cb, { once: true });
}

waitFirebase(() => {
  state.dbReady = true;
  document.getElementById('fb-dot').classList.add('ok');
  document.getElementById('fb-status').textContent = 'Firebase 연결됨 — 데이터 자동 저장';
  loadFromFirebase();
});

function saveToFirebase(item) {
  if (!state.dbReady) return;
  window._set(window._ref(window._db, 'students/' + item.id), {
    filename: item.filename,
    studentId: item.studentId || '',
    name: item.name || '',
    dataUrl: item.dataUrl || '',
  });
}

function loadFromFirebase() {
  window._onValue(window._ref(window._db, 'students'), snap => {
    const data = snap.val() || {};
    Object.entries(data).forEach(([id, v]) => {
      const existing = state.items.find(x => x.id === id);
      if (existing) {
        existing.studentId = v.studentId;
        existing.name = v.name;
        if (!existing.dataUrl && v.dataUrl) existing.dataUrl = v.dataUrl;
      } else {
        state.items.push({ id, filename: v.filename, studentId: v.studentId, name: v.name, dataUrl: v.dataUrl });
      }
    });
    renderAll();
  });
}

function removeFromFirebase(id) {
  if (!state.dbReady) return;
  window._set(window._ref(window._db, 'students/' + id), null);
}

// 업로드
document.getElementById('file-input').addEventListener('change', e => {
  Array.from(e.target.files).forEach(file => {
    if (state.items.find(x => x.filename === file.name)) return;
    const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    const reader = new FileReader();
    reader.onload = ev => {
      const item = { id, filename: file.name, dataUrl: ev.target.result, studentId: '', name: '' };
      state.items.push(item);
      saveToFirebase(item);
      renderAll();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});

// 렌더링
function renderAll() {
  const grid = document.getElementById('grid');
  document.getElementById('count-label').textContent = state.items.length + '명';

  if (state.items.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">🖼️</div><h2>사진을 업로드해 주세요</h2><p>"사진 폴더 선택"으로 여러 장을 한번에 선택하세요</p></div>`;
    return;
  }

  grid.innerHTML = state.items.map(item => `
    <div class="card" id="card-${item.id}">
      <span class="save-indicator" id="si-${item.id}">저장됨 ✓</span>
      <div class="card-img-wrap" onclick="openLightbox('${item.id}')">
        ${item.dataUrl
          ? `<img class="card-img" src="${item.dataUrl}" alt="${item.filename}" loading="lazy">`
          : `<div class="card-img-placeholder">📷</div>`}
        <span class="zoom-hint">🔍 원본 보기</span>
      </div>
      <div class="card-body">
        <div class="card-filename" title="${item.filename}">${item.filename}</div>
        <div class="card-field">
          <label>학번</label>
          <input type="text" value="${item.studentId || ''}" placeholder="예: 20241234"
            oninput="handleInput('${item.id}', 'studentId', this.value)">
        </div>
        <div class="card-field">
          <label>이름</label>
          <input type="text" value="${item.name || ''}" placeholder="홍길동"
            oninput="handleInput('${item.id}', 'name', this.value)">
        </div>
      </div>
    </div>
  `).join('');
}

// 자동저장
const timers = {};
function handleInput(id, field, value) {
  const item = state.items.find(x => x.id === id);
  if (!item) return;
  item[field] = value;
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => { saveToFirebase(item); showSaveIndicator(id); }, 700);
}

function showSaveIndicator(id) {
  const el = document.getElementById('si-' + id);
  if (!el) return;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
  showToast('자동 저장됨');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// 전체 삭제
function clearAll() {
  if (!confirm('모든 사진과 데이터를 삭제할까요?')) return;
  state.items.forEach(item => removeFromFirebase(item.id));
  state.items = [];
  renderAll();
  showToast('전체 삭제됨');
}

// ── 라이트박스 ──
function openLightbox(id) {
  const item = state.items.find(x => x.id === id);
  if (!item || !item.dataUrl) return;
  document.getElementById('lb-img').src = item.dataUrl;
  document.getElementById('lb-name').textContent = item.name || '(이름 없음)';
  document.getElementById('lb-id').textContent = item.studentId ? '학번: ' + item.studentId : item.filename;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ── PDF: 브라우저 인쇄 기능 사용 (한글 완벽 지원) ──
function printPDF() {
  if (state.items.length === 0) { showToast('사진이 없습니다'); return; }

  // 인쇄 영역 채우기
  document.getElementById('print-date').textContent = new Date().toLocaleDateString('ko-KR') + ' 기준';
  const pg = document.getElementById('print-grid');
  pg.innerHTML = state.items.map((item, i) => `
    <div class="print-card">
      ${item.dataUrl
        ? `<img src="${item.dataUrl}" alt="${item.filename}">`
        : `<div class="print-no-img">📷</div>`}
      <div class="print-card-body">
        <div class="pname">${item.name || '(이름 없음)'}</div>
        <div class="pid">${item.studentId || '학번 없음'}</div>
        <div class="pfile">${item.filename}</div>
      </div>
    </div>
  `).join('');

  showToast('인쇄 대화상자가 열립니다. PDF로 저장을 선택하세요!');
  setTimeout(() => window.print(), 400);
}

// ── Excel 저장 ──
function downloadExcel() {
  if (state.items.length === 0) { showToast('데이터가 없습니다'); return; }
  const rows = [['번호', '파일명', '학번', '이름']];
  state.items.forEach((item, i) => {
    rows.push([i + 1, item.filename, item.studentId || '', item.name || '']);
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 6 }, { wch: 32 }, { wch: 14 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ws, '수강생명부');
  XLSX.writeFile(wb, '수강생명부_' + new Date().toISOString().slice(0,10) + '.xlsx');
  showToast('Excel 저장 완료!');
}
</script>
</body>
</html>
